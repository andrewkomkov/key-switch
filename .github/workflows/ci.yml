name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build the app
        run: ARCHS="arm64 x86_64" ./Scripts/build-app.sh
      - name: Check the bundle
        run: |
          codesign --verify --strict --verbose=2 build/KeySwitch.app
          lipo -archs build/KeySwitch.app/Contents/MacOS/KeySwitch
          plutil -lint build/KeySwitch.app/Contents/Info.plist
      - name: Pack
        run: ditto -c -k --keepParent build/KeySwitch.app KeySwitch.zip
      - uses: actions/upload-artifact@v7
        with:
          name: KeySwitch
          path: KeySwitch.zip
          retention-days: 14
