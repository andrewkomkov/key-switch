name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      - name: Build the app
        run: ARCHS="arm64 x86_64" ./Scripts/build-app.sh
      - name: Pack
        run: |
          ditto -c -k --keepParent build/KeySwitch.app KeySwitch.zip
          shasum -a 256 KeySwitch.zip > KeySwitch.zip.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" KeySwitch.zip KeySwitch.zip.sha256
