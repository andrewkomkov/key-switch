name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: swift test
      # With the same identity in each release, macOS keeps the Accessibility permission
      # after an upgrade. Without the secret the build script signs ad hoc.
      - name: Import the signing identity
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
        run: |
          if [ -n "$SIGNING_P12_BASE64" ]; then ./Scripts/make-signing-identity.sh; fi
      - name: Build the app
        run: ARCHS="arm64 x86_64" ./Scripts/build-app.sh
      - name: Show the signature
        run: codesign --display --requirements - build/KeySwitch.app
      - name: Pack
        run: |
          ditto -c -k --keepParent build/KeySwitch.app KeySwitch.zip
          shasum -a 256 KeySwitch.zip > KeySwitch.zip.sha256
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" KeySwitch.zip KeySwitch.zip.sha256

  # Writes the new version and hash to the Homebrew tap, andrewkomkov/homebrew-tap.
  cask:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: andrewkomkov/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Write the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          sha=$(gh release download "$TAG" --pattern KeySwitch.zip.sha256 --output - | cut -d' ' -f1)
          ./Scripts/render-cask.sh "${TAG#v}" "$sha" > tap/Casks/key-switch.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/key-switch.rb
          git diff --cached --quiet || git commit -m "chore: update key-switch to ${TAG#v}"
          git push
